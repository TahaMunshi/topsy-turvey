<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Topsy Turvy POS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* =====================================================================
   DESIGN TOKENS: from the "Topsy Turvy POS" design system
   Layout: top bar + alert strip, icon sidebar, scrolling work area.
   Deliberately single (light) theme: counter screens and TV are light.
   ===================================================================== */
:root{
  color-scheme: light;
  --brand-red:#E31E3C; --brand-blue:#1BA0DE; --brand-green:#1FA246; --brand-purple:#6A3A97;
  --brand-yellow:#F7D41B; --brand-orange:#F28C28; --brand-pink:#E83E8C; --brand-lime:#8CC63F;
  --ink:#1F2A5A; --ink-muted:#5B6488; --surface-100:#F7F8FC; --surface-card:#FFFFFF; --surface-sunk:#EEF0F8; --line:#E1E5F0;
  --ok:#157A33; --ok-tint:#E4F6EA; --warn:#9A5208; --warn-tint:#FFF1DC; --bad:#B5122C; --bad-tint:#FDE4E8; --on-brand:#FFFFFF;
  --font-display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --space-1:6px; --space-2:10px; --space-3:14px; --space-4:20px; --space-6:28px; --tap-min:48px;
  --radius-sm:10px; --radius-btn:12px; --radius-card:18px; --radius-pill:999px;
  --shadow-card:0 1px 3px rgba(31,42,90,.05),0 6px 18px rgba(31,42,90,.06);
  --shadow-pop:0 16px 44px rgba(31,42,90,.18);
  --accent:var(--brand-red);
}
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--surface-100);color:var(--ink);font:15px/22px var(--font-sans);-webkit-tap-highlight-color:transparent;overflow:hidden}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:28px;line-height:34px} h2{font-size:20px;line-height:26px} h3{font-size:17px;line-height:22px}
.num,.money,td.r{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand-blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.muted{color:var(--ink-muted)} .small{font-size:13px;line-height:18px} .lbl{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted)}
.row{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap} .col{display:flex;flex-direction:column;gap:var(--space-3)}
.grow{flex:1;min-width:0} .right{margin-left:auto} .center{text-align:center}
.grid{display:grid;gap:var(--space-4)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* ---------- Buttons ---------- */
.btn{min-height:var(--tap-min);padding:0 20px;border:0;border-radius:var(--radius-btn);background:var(--surface-sunk);color:var(--ink);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .14s,box-shadow .14s,filter .14s,background .14s;white-space:nowrap}
.btn:hover{filter:brightness(.97);transform:translateY(-1px)} .btn:active{transform:scale(.98)}
.btn.primary,.btn.blue,.btn.green,.btn.pink,.btn.purple,.btn.orange{box-shadow:0 6px 16px rgba(31,42,90,.16)}
.btn.primary:hover,.btn.blue:hover,.btn.green:hover,.btn.pink:hover,.btn.purple:hover,.btn.orange:hover{box-shadow:0 10px 22px rgba(31,42,90,.22)}
.btn.primary{background:var(--brand-red);color:var(--on-brand)}
.btn.blue{background:var(--brand-blue);color:var(--on-brand)} .btn.green{background:var(--brand-green);color:var(--on-brand)}
.btn.pink{background:var(--brand-pink);color:var(--on-brand)} .btn.purple{background:var(--brand-purple);color:var(--on-brand)}
.btn.orange{background:var(--brand-orange);color:var(--on-brand)} .btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px} .btn.lg{min-height:64px;font-size:18px;padding:0 28px}
.btn.block{width:100%} .btn[disabled]{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.iconbtn{width:var(--tap-min);height:var(--tap-min);border:0;border-radius:var(--radius-btn);background:var(--surface-sunk);cursor:pointer;font-size:20px;display:inline-grid;place-items:center}

/* ---------- Pills & chips ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:var(--radius-pill);font-size:12px;line-height:16px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.p-ok{background:var(--ok-tint);color:var(--ok)} .p-warn{background:var(--warn-tint);color:var(--warn)} .p-bad{background:var(--bad-tint);color:var(--bad)}
.p-grey{background:var(--surface-sunk);color:var(--ink-muted)} .p-blue{background:var(--brand-blue);color:#fff} .p-green{background:var(--brand-green);color:#fff}
.p-pink{background:var(--brand-pink);color:#fff} .p-orange{background:var(--brand-orange);color:#fff} .p-purple{background:var(--brand-purple);color:#fff}
.chip{min-height:40px;padding:0 14px;border-radius:var(--radius-pill);border:2px solid var(--line);background:var(--surface-card);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--accent);background:var(--accent);color:#fff}

/* ---------- Cards / forms ---------- */
.card{background:var(--surface-card);border-radius:var(--radius-card);box-shadow:var(--shadow-card);border:1px solid rgba(31,42,90,.06);padding:var(--space-4)}
.card.pad{padding:var(--space-6)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface-sunk);border:2px solid transparent;border-radius:var(--radius-sm);min-height:var(--tap-min);padding:0 12px;width:100%;min-width:0}
textarea{padding:10px 12px;min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-blue);background:#fff}
input.err{border-color:var(--brand-red)}
.hint{font-size:12px;color:var(--ink-muted)}
.stepper{display:inline-flex;align-items:center;background:var(--surface-sunk);border-radius:var(--radius-btn)}
.stepper button{width:44px;height:44px;border:0;background:transparent;font-size:22px;font-weight:700;cursor:pointer;border-radius:var(--radius-btn)}
.stepper button:active{background:var(--line)}
.stepper b{min-width:36px;text-align:center;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;background:var(--surface-sunk);border-radius:var(--radius-btn);padding:4px;flex-wrap:wrap}
.tabs button{min-height:42px;padding:0 16px;border:0;border-radius:10px;background:transparent;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--surface-card);box-shadow:var(--shadow-card);color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
.tablewrap{overflow-x:auto}
.sep{height:1px;background:var(--line);margin:4px 0}

/* ---------- App shell ---------- */
#app{height:100%;display:grid;grid-template-rows:auto auto 1fr;grid-template-columns:224px 1fr;grid-template-areas:"top top" "alert alert" "nav main"}
#top{grid-area:top;position:relative;display:flex;align-items:center;gap:14px;padding:12px max(22px,env(safe-area-inset-right,0px)) 10px max(22px,env(safe-area-inset-left,0px));background:var(--surface-card);border-bottom:1px solid var(--line);min-height:70px;flex-wrap:wrap}
#top::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brand-red),var(--brand-orange),var(--brand-yellow),var(--brand-green),var(--brand-blue),var(--brand-purple),var(--brand-pink))}
.logo-tt{height:44px;width:44px;border-radius:12px;object-fit:contain}
.ttfallback{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--brand-yellow);font:700 18px var(--font-display);letter-spacing:-1px}
.ttfallback i{font-style:normal}
.wordmark{font:700 22px var(--font-display);letter-spacing:.5px;white-space:nowrap}
#top select{min-height:42px;width:auto;font-weight:600}
.clock{font:700 20px var(--font-sans);font-variant-numeric:tabular-nums}
.userchip{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 4px;border-radius:var(--radius-pill);background:var(--surface-sunk)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 16px var(--font-display)}
#alerts{grid-area:alert;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));background:var(--surface-100);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.allclear{font-size:13px;color:var(--ok);font-weight:600;padding:2px 4px}
.banner{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;border-radius:var(--radius-btn);font-size:15px;flex-wrap:wrap}
.banner .txt{flex:1;min-width:200px}
.banner.amber{background:var(--warn-tint);color:var(--warn)} .banner.red{background:var(--bad-tint);color:var(--bad);box-shadow:inset 0 0 0 2px var(--brand-red)}
.banner .btn{min-height:40px;padding:0 12px;font-size:14px;background:var(--surface-card);color:var(--ink)}
#nav{grid-area:nav;background:var(--surface-card);border-right:1px solid var(--line);padding:14px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
#nav button{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border:0;border-radius:var(--radius-btn);background:transparent;cursor:pointer;font-weight:600;text-align:left;color:var(--ink);transition:background .12s,transform .12s}
#nav button:hover{background:var(--surface-100)}
#nav button .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-sunk);flex:none;transition:background .15s,color .15s}
#nav button.on{background:var(--surface-sunk);font-weight:700} #nav button.on .ic{background:var(--acc);color:#fff}
.navbadge{margin-left:auto;background:var(--brand-red);color:#fff;border-radius:999px;min-width:24px;height:24px;padding:0 7px;font-size:12px;font-weight:700;display:grid;place-items:center}
#nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#main{grid-area:main;overflow-y:auto;padding:28px max(32px,env(safe-area-inset-right,0px)) 120px max(32px,env(safe-area-inset-left,0px));min-width:0}
.screenhead{display:flex;align-items:center;gap:var(--space-3);margin-bottom:20px;flex-wrap:wrap}
.screenhead h1{display:flex;align-items:center;gap:10px}
.screenhead .dot{width:14px;height:14px;border-radius:50%;background:var(--accent)}

/* ---------- Home ---------- */
.kpi{position:relative;overflow:hidden;padding:20px 22px}
.kpi .v{font:700 30px/36px var(--font-sans);font-variant-numeric:tabular-nums;margin-top:8px}
.kpi .s{font-size:13px;color:var(--ink-muted);margin-top:6px}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-4);margin-bottom:22px}
.quick button{min-height:112px;border:0;border-radius:var(--radius-card);color:#fff;font:600 22px var(--font-display);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:18px 20px;text-align:left;box-shadow:0 10px 24px rgba(31,42,90,.16);transition:transform .15s,box-shadow .15s,filter .15s}
.quick button:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(31,42,90,.22);filter:brightness(1.03)}
.quick button:active{transform:scale(.98)} .quick small{font:500 13px var(--font-sans);opacity:.92}
.cta{display:flex;align-items:center;gap:24px;background:var(--brand-yellow);border-radius:var(--radius-card);padding:28px}

/* ---------- Denominations ---------- */
.denoms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.denom{display:flex;align-items:center;gap:10px;background:var(--surface-sunk);border-radius:var(--radius-btn);padding:6px 6px 6px 14px}
.denom .note{font-weight:700;min-width:64px;font-variant-numeric:tabular-nums}
.denom input{width:70px;text-align:center;background:#fff;min-height:44px;padding:0 4px}
.denom .sub{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink-muted);min-width:96px;text-align:right;padding-right:8px}
.bigtotal{font:700 34px var(--font-sans);font-variant-numeric:tabular-nums}

/* ---------- Ticket / Café ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:var(--space-6);align-items:start}
.summary{position:sticky;top:0}
.passbtn{border:3px solid transparent;border-radius:var(--radius-card);padding:20px;cursor:pointer;color:#fff;text-align:left;min-height:116px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 24px rgba(31,42,90,.16);transition:transform .15s,box-shadow .15s}
.passbtn:hover{transform:translateY(-2px)}
.passbtn b{font:600 22px var(--font-display)} .passbtn.on{border-color:var(--ink);box-shadow:0 0 0 3px #fff inset,0 12px 26px rgba(31,42,90,.2)}
.childrow{display:grid;grid-template-columns:minmax(0,2fr) 90px minmax(0,1.2fr) 48px;gap:12px;align-items:end}
.line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-variant-numeric:tabular-nums}
.line.total{font-weight:700;font-size:20px;border-top:2px solid var(--line);padding-top:12px;margin-top:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.tile{position:relative;border:1px solid rgba(31,42,90,.06);border-radius:var(--radius-btn);background:var(--surface-card);box-shadow:var(--shadow-card);padding:16px 14px;cursor:pointer;text-align:left;min-height:126px;display:flex;flex-direction:column;gap:6px;transition:transform .12s,box-shadow .12s}
.tile:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(31,42,90,.1)}
.tile:active{transform:scale(.97)} .tile .em{font-size:32px;line-height:38px} .tile .nm{font-weight:600;line-height:19px} .tile .pr{color:var(--ink-muted);font-variant-numeric:tabular-nums;margin-top:auto}
.tile .low{position:absolute;top:8px;right:8px} .tile[disabled]{opacity:.45}
.cartline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}

/* ---------- Floor board ---------- */
.floorgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.fc{background:var(--surface-card);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:18px;border:3px solid transparent;display:flex;flex-direction:column;gap:8px;min-width:0}
.fc.amber{background:var(--warn-tint)} .fc.red{background:var(--bad-tint);border-color:var(--brand-red);animation:pulse 1.2s ease-in-out infinite}
.fc.hl{box-shadow:0 0 0 4px var(--brand-blue)}
@keyframes pulse{50%{border-color:rgba(227,30,60,.25)}}
.fc .nm{font:600 21px/25px var(--font-display);overflow-wrap:anywhere}
.fc .cd{font:700 42px/46px var(--font-sans);font-variant-numeric:tabular-nums;color:var(--ok)}
.fc.amber .cd{color:var(--warn)} .fc.red .cd{color:var(--bad);font-size:30px;line-height:46px}
.fc .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px} .fc .acts .btn{flex:1;min-height:42px;padding:0 8px;font-size:13px;background:var(--surface-card);box-shadow:inset 0 0 0 2px var(--line)}
.groupcard{grid-column:1/-1}
.groupkids{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:8px}
.gk{background:var(--surface-sunk);border-radius:var(--radius-sm);padding:8px 10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 16px;color:var(--ink-muted);text-align:center}
.empty svg{width:120px;height:120px}

/* TV mode */
body.tv #nav,body.tv #top,body.tv .demo{display:none!important}
body.tv #app{grid-template-columns:1fr;grid-template-areas:"top" "alert" "main"}
body.tv #main{padding:24px 32px}
body.tv .fc .nm{font-size:30px;line-height:34px} body.tv .fc .cd{font-size:56px;line-height:60px} body.tv .fc.red .cd{font-size:40px}
body.tv .fc .acts,body.tv .fc .price,body.tv .floortools{display:none}
body.tv .floorgrid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.tvhead{display:none;align-items:center;gap:16px;margin-bottom:18px} body.tv .tvhead{display:flex}

/* ---------- Bookings ---------- */
.cal{display:grid;grid-template-columns:90px repeat(7,minmax(0,1fr));gap:6px;min-width:860px}
.cal .hd{font-weight:600;text-align:center;padding:8px 4px;border-radius:var(--radius-sm);background:var(--surface-card)}
.cal .hd.today{background:var(--brand-pink);color:#fff}
.cal .rm{font:600 15px var(--font-display);display:grid;place-items:center;background:var(--surface-card);border-radius:var(--radius-sm)}
.cal .cell{display:flex;flex-direction:column;gap:5px;background:var(--surface-card);border-radius:var(--radius-sm);padding:6px}
.slot{min-height:44px;border:2px dashed var(--line);border-radius:var(--radius-sm);background:transparent;cursor:pointer;text-align:left;padding:4px 8px;font-size:12px;line-height:15px;color:var(--ink-muted)}
.slot:hover{border-color:var(--brand-pink);color:var(--ink)}
.slot.party{background:var(--brand-pink);border:0;color:#fff} .slot.school{background:var(--brand-orange);border:0;color:#fff}
.slot.enq{background:var(--surface-sunk);border:2px solid var(--brand-pink);color:var(--ink)}
.slot b{display:block;font-size:12px}
.pkg{border:3px solid var(--line);border-radius:var(--radius-card);padding:16px;cursor:pointer;background:var(--surface-card);text-align:left}
.pkg.on{border-color:var(--brand-pink);background:#FFF2F8}
.pkg ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink-muted)}
.pricebox{background:var(--surface-sunk);border-radius:var(--radius-card);padding:16px}
.err-msg{color:var(--bad);font-weight:600;font-size:14px}

/* ---------- Reports ---------- */
.chart text{font:12px var(--font-sans);fill:var(--ink-muted)}
.chart .v{fill:var(--ink);font-weight:600}

/* ---------- Login ---------- */
#login{position:fixed;inset:0;z-index:50;background:var(--surface-100);display:grid;place-items:center;overflow:auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.loginbox{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;max-width:900px;width:100%;align-items:center}
.wm{font:700 64px/0.95 var(--font-display);letter-spacing:1px}
.tag{font:600 16px var(--font-display);letter-spacing:4px;color:var(--ink-muted);margin-top:10px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pinpad button{height:64px;border:0;border-radius:var(--radius-btn);background:var(--surface-card);box-shadow:var(--shadow-card);font:600 24px var(--font-sans);cursor:pointer}
.pinpad button:active{background:var(--surface-sunk)}
.pindots{display:flex;justify-content:center;gap:14px;margin:6px 0 14px}
.pindots i{width:18px;height:18px;border-radius:50%;background:var(--line)} .pindots i.f{background:var(--ink)}
.shake{animation:shake .3s} @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hintchip{border:0;background:var(--surface-card);box-shadow:var(--shadow-card);border-radius:var(--radius-pill);padding:6px 12px 6px 6px;display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-size:13px;min-height:44px}

/* ---------- Modal / toast / demo ---------- */
#modals .ov{position:fixed;inset:0;background:rgba(31,42,90,.45);z-index:90;display:grid;place-items:center;padding:16px;animation:fade .12s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface-card);border-radius:var(--radius-card);box-shadow:var(--shadow-pop);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px}
.modal.wide{width:min(900px,100%)} .modal.xwide{width:min(1100px,100%)}
.modal .mh{display:flex;align-items:center;gap:10px;margin-bottom:14px} .modal .mh .x{margin-left:auto}
.modal .mf{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--radius-btn);font-weight:600;box-shadow:var(--shadow-pop);animation:fade .15s;max-width:90vw}
.toast.bad{background:var(--bad)} .toast.ok{background:var(--ok)}

.demo button.on{background:var(--brand-yellow);color:var(--ink)}
.demo .t{font-variant-numeric:tabular-nums;font-weight:700;padding:0 6px}

/* ---------- Keyboard ---------- */
body.kb [data-key]{position:relative}
body.kb [data-key]::after{content:attr(data-key);position:absolute;top:-8px;right:-6px;z-index:3;background:var(--ink);color:#fff;font:700 10px/1 var(--font-sans);letter-spacing:0;text-transform:none;padding:3px 5px;border-radius:6px;white-space:nowrap;pointer-events:none;box-shadow:0 0 0 2px var(--surface-card)}
body.kb #nav [data-key]::after{top:50%;right:6px;transform:translateY(-50%)}
body.kb .demo [data-key]::after{display:none}
body.kb .navbadge{margin-right:44px}
.kbsel{outline:4px solid var(--brand-blue)!important;outline-offset:2px}
.kbpress{transform:scale(.96)!important;filter:brightness(.92)}
kbd{display:inline-block;min-width:24px;padding:2px 7px;border-radius:6px;background:var(--surface-sunk);border:1px solid var(--line);border-bottom-width:3px;font:600 12px/18px var(--font-sans);color:var(--ink);text-align:center}
#nav{overflow-x:hidden}

/* ---------- Print previews (screen) ---------- */
.band{display:flex;align-items:center;gap:12px;height:86px;width:100%;max-width:900px;background:#fff;color:#111;border:1px solid #ccc;border-radius:43px;padding:0 18px 0 12px;overflow:hidden;font-family:var(--font-sans)}
.band .stripe{width:16px;align-self:stretch;flex:none}
.band .bn{font:700 30px/32px var(--font-display);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band .bs{font-size:11px;line-height:14px;white-space:nowrap}
.band .be{font:700 21px var(--font-sans);white-space:nowrap}
.band .bq svg{width:64px;height:64px;display:block}
.band .btt{font:700 18px var(--font-display);flex:none}
.receipt{width:302px;background:#fff;color:#111;font:12px/16px ui-monospace,"Cascadia Mono",Consolas,monospace;padding:14px 12px;border:1px solid #ddd;margin:0 auto}
.receipt .c{text-align:center} .receipt .b{font-weight:700} .receipt .hr{border-top:1px dashed #555;margin:6px 0}
.receipt .l{display:flex;justify-content:space-between;gap:8px} .receipt .big{font-size:15px;line-height:20px;font-weight:700}
.receipt .logo{font:700 20px var(--font-display);text-align:center}
.prevwrap{background:var(--surface-sunk);border-radius:var(--radius-card);padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;overflow:auto}
.prevwrap>*{flex:none}
#print{display:none}

@media print{
  body{overflow:visible;background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block}
  #print .band .bn{font-size:36px!important;line-height:38px}

  #print .receipt{width:76mm;border:0;margin:0;page-break-after:always;break-after:page}
}

@media (max-width:1180px){.split{grid-template-columns:minmax(0,1fr) 320px}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}

}

function seed() {

  else {
    const nd = t => typeof t === 'string' ? t.replace(/ [\u2014\u2013] /g, ': ').replace(/[\u2014\u2013]/g, ' ') : t; // older saves used dashes
    if (!S.audit) S.audit = seedAudit(S); if (!S.sessions) S.sessions = seedSessions(S);
    S.sessions.filter(x => x.device === 'this' && !x.end).forEach(x => x.end = x.lastAt); // this screen was closed
    S.settings.branches.forEach(b => b.name = nd(b.name)); S.bookings.forEach(b => b.theme = nd(b.theme));
    const c = S.clock; c.demoAt = c.paused ? c.demoAt : c.demoAt + (Date.now() - c.realAt); c.realAt = Date.now(); c.speed = 1; }
  session.branch = S.last.branch; session.counter = S.last.counter;
}
let saveTimer = null;

  if (!S) return; const c = S.clock; const n = now(); const copy = { ...S, clock: { ...c, demoAt: n, realAt: Date.now() } };

function shiftSales(sh, st = S) { return st.sales.filter(x => x.shiftId === sh.id); }
function payTotal(sh, method, st = S) { return sum(shiftSales(sh, st), x => sum(x.payments.filter(p => p.method === method), p => p.amount)); }
function moveTotal(sh, type, st = S) { return sum(st.moves.filter(m => m.shiftId === sh.id && m.type === type), m => m.amount); }
// Expected cash = float + cash sales/advances/balances + cash in − cash out − cash refunds (refund sales carry negative cash amounts)
function expectedCash(sh, st = S) { return sh.float + payTotal(sh, 'cash', st) + moveTotal(sh, 'in', st) - moveTotal(sh, 'out', st); }
function openShift(branch = session.branch, counter = session.counter) { return S.shifts.find(s => s.branch === branch && s.counter === counter && s.status === 'open'); }
function salesTotalBy(list, pred) { return sum(list.filter(pred), x => x.total); }

   ===================================================================== */
let AC = null;
function chime(level) {
  if (S.mute) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const tones = level === 'red' ? [880, 660, 880] : [660, 880];
    const vol = level === 'red' ? 0.32 : 0.14;
    tones.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + i * 0.22;
      o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + 0.22);
    });
  } catch (e) { /* audio unavailable: silent */ }
}

    const el = openModal(mh('Manager PIN needed', esc(reason)) + `<div class="pindots" id="mpd">${'<i></i>'.repeat(4)}</div><div class="pinpad" id="mpp">${[1, 2, 3, 4, 5, 6, 7, 8, 9, 'C', 0, '⌫'].map(k => `<button data-k="${k}">${k}</button>`).join('')}</div><div class="hint center" style="margin-top:10px">Ask Hina (Manager): demo PIN 3333</div>`, '', () => res(null));

        <div class="row">${qs.map(q => `<button class="btn" data-q="${q[1]}" ${q[0] === 'Exact' ? 'data-key="Alt+E"' : ''}>${q[0] === 'Exact' ? 'Exact ' + num(r) : q[0]}</button>`).join('')}</div>
        <div class="row" style="justify-content:space-between;background:var(--surface-sunk);border-radius:12px;padding:12px 16px"><span class="lbl">Change due</span><span class="bigtotal" id="pm-chg">${pkr(0)}</span></div>`;
      } else if (P.tab === 'card') {
        body = `<label class="field"><span>Card amount</span><input id="pm-amt" inputmode="numeric" value="${esc(P.amt)}"></label><div class="hint">Run the amount on the card machine, then confirm.</div>`;
      } else {
        body = `<div class="row">${['JazzCash', 'Easypaisa', 'Bank transfer'].map(s => `<button class="chip ${P.sub === s ? 'on' : ''}" data-sub="${s}" data-key="Alt+${{ JazzCash: 'J', Easypaisa: 'Y', 'Bank transfer': 'B' }[s]}">${s}</button>`).join('')}</div>

      }

/* =====================================================================
   ALERTS ENGINE: amber at warn-min, red at end, red repeats, snooze, log
   ===================================================================== */
function logAlert(f, level, action, by) { S.alertLog.push({ at: now(), floorId: f.id, name: f.name, ticketNo: f.ticketNo, branch: f.branch, level, action, by: by || null }); }
function onFloor(branch = session.branch) { return S.floor.filter(f => f.status === 'on' && f.branch === branch); }
function levelOf(f, t = now()) {
  const rem = f.end - t, warn = (f.pass === 'day' ? ST().alerts.dayWarn : ST().alerts.warn) * MIN;
  return rem <= 0 ? 'red' : rem <= warn ? 'amber' : 'green';
}
function evalAlerts() {
  const t = now(); let ch = null; const loggedGroups = new Set();
  for (const f of onFloor()) {
    const lv = levelOf(f, t); f.fl = f.fl || {};
    if (lv === 'amber' && !f.fl.amber) { f.fl.amber = t; logAlert(f, 'amber', 'alert'); ch = ch || 'amber'; save(); }
    if (lv === 'red') {
      if (!f.fl.red) { f.fl.red = t; f.fl.lastChime = t; logAlert(f, 'red', 'alert'); ch = 'red'; save(); if (!f.group || !loggedGroups.has(f.group.bookingId)) { if (f.group) loggedGroups.add(f.group.bookingId); audit('floor', `Time up: ${f.group ? f.group.label + ' group' : f.name} (${passLabel(f)} ended ${fmtT(f.end)})`, { by: null, level: 'warn', branch: f.branch, counter: f.counter, at: f.end }); } }
      else if (!(f.fl.snoozeUntil > t) && t - f.fl.lastChime >= ST().alerts.redRepeat * MIN) { f.fl.lastChime = t; ch = 'red'; }
    }
  }
  if (ch) chime(ch);
}
function activeAlerts() {
  const t = now(), items = [], groups = {};
  for (const f of onFloor()) {
    const lv = levelOf(f, t); if (lv === 'green') continue;
    if (lv === 'amber' && f.fl.dismissed) continue;
    if (lv === 'red' && f.fl.snoozeUntil > t) continue;
    if (f.group) { const g = groups[f.group.bookingId]; if (g) { g.count++; continue; } }
    const it = { f, lv, count: 1 }; items.push(it); if (f.group) groups[f.group.bookingId] = it;
  }
  return items.sort((a, b) => (a.lv === b.lv ? a.f.end - b.f.end : a.lv === 'red' ? -1 : 1));
}
let alertSig = '';
function renderAlerts(force) {
  if (!session.user) { $('#alerts').innerHTML = ''; return; }
  const al = activeAlerts(); const sig = al.map(a => a.f.id + a.lv + a.count).join('|') + S.mute;
  if (!force && sig === alertSig) return; alertSig = sig;
  if (!al.length) { $('#alerts').innerHTML = `<div class="allclear">All children within time ✓</div>`; return; }
  const show = al.slice(0, 3);
  const more = al.length > 3 ? `<button class="btn" style="background:var(--ink);color:#fff" data-key="Alt+Shift+F" onclick="go('floor','alerts')">+${al.length - 3} more</button>` : '';
  $('#alerts').innerHTML = show.map((a, i) => {
    const f = a.f, who = f.group ? `${esc(f.group.label)} group (${a.count})` : esc(f.name);
    const K = k => i === 0 ? `data-key="Alt+Shift+${k}"` : '';
    const acts = (can('floor') ? `<button class="btn" ${K('M')} onclick="markOut('${f.id}')">Mark Out</button><button class="btn" ${K('E')} onclick="extend('${f.id}')">Extend 30 min</button>` : '');
    if (a.lv === 'amber') return `<div class="banner amber"><span class="txt">⏰ <b>${who}</b>: ${esc(passLabel(f))} ends in ${Math.max(1, Math.ceil((f.end - now()) / MIN))} min (${fmtT(f.end)})</span>${acts}<button class="btn" ${K('D')} onclick="dismissAlert('${f.id}')">Dismiss</button>${i === show.length - 1 ? more : ''}</div>`;
    return `<div class="banner red"><span class="txt">🔴 <b>${who}</b>: time is up <span class="small">(ended ${fmtT(f.end)})</span></span>${acts}${!f.fl.snoozed ? `<button class="btn" ${K('Z')} onclick="snooze('${f.id}')">Snooze 5 min</button>` : ''}${i === show.length - 1 ? more : ''}</div>`;
  }).join('');
}
function groupMates(f) { return f.group ? onFloor(f.branch).filter(x => x.group && x.group.bookingId === f.group.bookingId) : [f]; }
function dismissAlert(id) { const f = S.floor.find(x => x.id === id); groupMates(f).forEach(x => { x.fl.dismissed = true; logAlert(x, 'amber', 'dismissed', session.user.id); }); save(); renderAlerts(true); }
function snooze(id) { const f = S.floor.find(x => x.id === id); groupMates(f).forEach(x => { x.fl.snoozeUntil = now() + ST().alerts.snooze * MIN; x.fl.snoozed = true; x.fl.lastChime = now() + ST().alerts.snooze * MIN; logAlert(x, 'red', 'snoozed', session.user.id); }); audit('floor', `Snoozed the time-up alert for ${f.group ? f.group.label + ' group' : f.name} by ${ST().alerts.snooze} min`, { level: 'warn' }); save(); renderAlerts(true); toast('Snoozed for ' + ST().alerts.snooze + ' min'); }

/* =====================================================================
   FLOOR ACTIONS: mark out, extend (pending overtime charge), reprint
   ===================================================================== */
function overtimeFor(f, t = now()) { const over = t - f.end; if (over <= 0) return 0; const o = ST().overtime; return Math.ceil(over / (o.mins * MIN)) * o.price; }
function addCharge(f, amount, desc) {
  const c = { id: uid(), floorId: f.id, ticketNo: f.ticketNo, name: f.name, amount, desc, branch: f.branch, counter: f.counter, at: now(), by: session.user.id, status: 'pending' };
  S.charges.push(c); return c;
}
function markOut(id) {
  const f = S.floor.find(x => x.id === id); if (!f) return;
  const mates = groupMates(f); const t = now();
  const ot = sum(mates, m => overtimeFor(m, t));
  mates.forEach(m => { const o = overtimeFor(m, t); m.status = 'out'; m.outAt = t; m.outBy = session.user.id; logAlert(m, levelOf(m, t), 'marked out', session.user.id); if (o) addCharge(m, o, 'Overtime ' + Math.ceil((t - m.end) / MIN) + ' min'); });
  save(); renderAlerts(true); rerender();
  const who = f.group ? f.group.label + ' group' : f.name;
  if (ot > 0) audit('floor', `Marked out ${who} ${Math.ceil((t - f.end) / MIN)} min over time, ${pkr(ot)} overtime charged`, { level: 'warn' });
  if (ot > 0) chargePrompt(mates.map(m => S.charges.find(c => c.floorId === m.id && c.status === 'pending')).filter(Boolean), `${who} marked out: ${pkr(ot)} overtime due`);
  else toast(who + ' marked out ✓', 'ok');
}
function extend(id) {
  const f = S.floor.find(x => x.id === id); if (!f) return;
  const mates = groupMates(f); const t = now(); const p = ST().overtime.price, m30 = ST().overtime.mins;
  const charges = mates.map(m => { m.end = Math.max(m.end + m30 * MIN, t + 5 * MIN); m.fl = {}; m.ext = (m.ext || 0) + 1; logAlert(m, 'extend', 'extended 30 min', session.user.id); return addCharge(m, p, 'Extend ' + m30 + ' min (new end ' + fmtT(m.end) + ')'); });
  audit('floor', `Extended ${f.group ? f.group.label + ' group' : f.name} by ${m30} min to ${fmtT(f.end)}, ${pkr(sum(charges, c => c.amount))} charge`);
  save(); renderAlerts(true); rerender();
  chargePrompt(charges, `${f.group ? f.group.label + ' group' : f.name} extended to ${fmtT(f.end)}`);
}
function chargePrompt(charges, title) {
  const total = sum(charges, c => c.amount);
  window.__ch = charges.map(c => c.id);
  const canPay = can('sell') && openShift();
  openModal(mh(title) + `<p>${pkr(total)} is added to the counter as a pending charge.</p>
   ${charges.map(c => `<div class="line"><span>${esc(c.name)} · ${esc(c.desc)}</span><b>${pkr(c.amount)}</b></div>`).join('')}
   ${!canPay ? `<p class="hint">${can('sell') ? 'Open the counter to collect it.' : 'The parent pays this at the counter before leaving.'}</p>` : ''}
   <div class="mf"><button class="btn" data-key="Alt+L" onclick="closeModal()">Collect later</button>${can('sell') ? `<button class="btn ghost" data-key="Alt+W" onclick="closeModal(true);waiveCharges(window.__ch)">Waive</button>` : ''}${canPay ? `<button class="btn primary" data-key="F9" onclick="closeModal(true);collectCharges(window.__ch)">Collect ${pkr(total)} now</button>` : ''}</div>`);
}
async function collectCharges(ids) {
  const sh = openShift(); if (!sh) return toast('Open the counter first', 'bad');
  const cs = S.charges.filter(c => ids.includes(c.id) && c.status === 'pending'); if (!cs.length) return;
  const total = sum(cs, c => c.amount);
  const r = await payModal(total, 'Collect overtime'); if (!r) return;
  const sale = recordSale('overtime', cs.map(c => ({ name: c.desc + ': ' + c.name, qty: 1, price: c.amount, cat: 'overtime' })), r, { childName: cs[0].name });
  cs.forEach(c => { c.status = 'paid'; c.saleId = sale.id; c.paidAt = now(); });
  save(); rerender(); showReceiptModal(sale, 'Overtime paid');
}
async function waiveCharges(ids) {
  const m = await needManager('Waive overtime charge'); if (!m) return;
  const ws = S.charges.filter(c => ids.includes(c.id) && c.status === 'pending'); ws.forEach(c => { c.status = 'waived'; c.waivedBy = m.id; });
  if (ws.length) audit('money', `Waived ${pkr(sum(ws, c => c.amount))} overtime for ${[...new Set(ws.map(c => c.name))].join(', ')}`, { level: 'bad', appr: m.id });
  save(); rerender(); toast('Charge waived by ' + m.name);
}
function reprint(id) { const f = S.floor.find(x => x.id === id); doPrint(bandHTML(f), 'band', 'Band ' + f.ticketNo + ' reprinted'); }

/* Records a sale against the current counter's open shift */
function recordSale(kind, lines, pay, extra = {}) {
  const sh = openShift(); const t = now();
  const gross = sum(lines, l => l.qty * l.price), disc = extra.discount || 0;
  const sale = { id: uid(), no: session.branch + '-' + session.counter + '-S' + pad(nextSeq('sale-' + session.branch + session.counter), 5), kind, branch: session.branch, counter: session.counter, shiftId: sh.id, bizDate: sh.bizDate, at: t, cashier: session.user.id, lines, discount: disc, total: gross - disc, payments: pay.payments, received: pay.received, change: pay.change, ...extra };
  S.sales.push(sale); touch(session.user.id); save(); return sale;
}

/* =====================================================================
   SCREEN: LIVE FLOOR BOARD (+ TV mode)
   ===================================================================== */
const FB = { filter: 'all', q: '', hl: null, open: {}, sel: null };
function floorList() {
  const t = now(); let L = onFloor();
  if (FB.filter === 'amber') L = L.filter(f => levelOf(f, t) === 'amber');
  if (FB.filter === 'red') L = L.filter(f => levelOf(f, t) === 'red');
  if (FB.filter === 'alerts') L = L.filter(f => levelOf(f, t) !== 'green');
  if (FB.filter === 'party') L = L.filter(f => f.pass === 'party');
  if (FB.filter === 'school') L = L.filter(f => f.pass === 'school');
  if (FB.q) { const q = FB.q.toLowerCase(); L = L.filter(f => f.name.toLowerCase().includes(q) || f.ticketNo.toLowerCase().includes(q) || (f.group && f.group.label.toLowerCase().includes(q))); }
  return L.sort((a, b) => a.end - b.end);
}
function cdText(f, t) { const rem = f.end - t; if (rem <= 0) return '+' + Math.max(1, Math.floor(-rem / MIN)) + ' min over'; const s = Math.floor(rem / 1000); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? h + ':' + pad(m) + ':' + pad(s % 60) : pad(m) + ':' + pad(s % 60); }
function floorCard(f, t) {
  const lv = levelOf(f, t), due = S.charges.filter(c => c.floorId === f.id && c.status === 'pending');
  return `<div class="fc ${lv === 'green' ? '' : lv} ${FB.hl === f.ticketNo ? 'hl' : ''} ${FB.sel === f.id ? 'kbsel' : ''}" data-fid="${f.id}" id="fc-${f.id}"><div class="row" style="gap:6px"><span class="pill ${f.pass === '2h' ? 'p-blue' : f.pass === 'day' ? 'p-green' : f.pass === 'party' ? 'p-pink' : 'p-orange'}">${esc(passLabel(f))}</span>${f.age ? `<span class="muted small">Age ${esc(f.age)}</span>` : ''}${due.length ? `<span class="pill p-warn price">${pkr(sum(due, c => c.amount))} due</span>` : ''}</div>
  <div class="nm">${esc(f.name)}</div><div class="small muted">${fmtT(f.start)} → <b>${fmtT(f.end)}</b>${f.ext ? ' · extended' : ''}</div><div class="cd">${cdText(f, t)}</div>
  <div class="small muted">${esc(f.ticketNo)} · ${esc(counterName(f.counter))}${f.group ? ' · ' + esc(f.group.label) : ''}</div>
  <div class="acts"><button class="btn" onclick="markOut('${f.id}')">Mark Out</button><button class="btn" onclick="extend('${f.id}')">Extend 30 min</button><button class="btn" onclick="reprint('${f.id}')">Reprint</button></div></div>`;
}
function groupCard(gid, kids, t) {
  const f = kids[0], lv = kids.reduce((w, k) => { const l = levelOf(k, t); return l === 'red' || w === 'red' ? 'red' : l === 'amber' || w === 'amber' ? 'amber' : 'green'; }, 'green');
  const open = FB.open[gid];
  return `<div class="fc groupcard ${lv === 'green' ? '' : lv} ${FB.sel === 'g:' + gid ? 'kbsel' : ''}" data-gid="${gid}"><div class="row"><span class="pill ${f.pass === 'party' ? 'p-pink' : 'p-orange'}">${f.pass === 'party' ? 'Party' : 'School trip'}</span><span class="nm">${esc(f.group.label)}</span><span class="muted">${kids.length} children · ${fmtT(f.start)} → <b>${fmtT(f.end)}</b></span><span class="cd right" style="font-size:32px">${cdText(f, t)}</span></div>
  <div class="acts"><button class="btn" onclick="FB.open['${gid}']=!FB.open['${gid}'];drawFloor(true)">${open ? 'Hide children ▴' : 'Show children ▾'}</button><button class="btn" onclick="markOut('${f.id}')">Mark Out all</button><button class="btn" onclick="extend('${f.id}')">Extend all 30 min</button><button class="btn" onclick="reprintGroup('${gid}')">Reprint bands</button></div>
  ${open ? `<div class="groupkids">${kids.map(k => `<div class="gk"><span><b>${esc(k.name)}</b><br><span class="small muted">${esc(k.ticketNo)}</span></span><button class="btn sm" onclick="markOutOne('${k.id}')">Out</button></div>`).join('')}</div>` : ''}</div>`;
}
function markOutOne(id) { const f = S.floor.find(x => x.id === id); const g = f.group; f.group = null; markOut(id); f.group = g; }
function reprintGroup(gid) { const k = onFloor().filter(f => f.group && f.group.bookingId === gid); doPrint(k.map(bandHTML).join(''), 'band', k.length + ' bands reprinted'); }
let floorSig = '';
function drawFloor(force) {
  const box = $('#floorgrid'); if (!box) return; const t = now();
  const L = floorList(); const solo = [], groups = {};
  L.forEach(f => { if (f.group) (groups[f.group.bookingId] = groups[f.group.bookingId] || []).push(f); else solo.push(f); });
  const sig = L.map(f => f.id + levelOf(f, t)).join() + JSON.stringify(FB) + S.charges.filter(c => c.status === 'pending').length;
  if (force || sig !== floorSig) {
    floorSig = sig;
    box.innerHTML = (L.length ? Object.entries(groups).map(([g, k]) => groupCard(g, k, t)).join('') + solo.map(f => floorCard(f, t)).join('') : `<div style="grid-column:1/-1">${emptyState(onFloor().length ? 'No children match this filter' : 'No children on the floor yet', onFloor().length ? '' : 'Sell a ticket and they will appear here.')}</div>`);
    const c = $('#floorcount'); if (c) c.textContent = onFloor().length + ' on the floor';
  } else {
    box.querySelectorAll('[data-fid]').forEach(el => { const f = S.floor.find(x => x.id === el.dataset.fid); if (f) el.querySelector('.cd').textContent = cdText(f, t); });
    box.querySelectorAll('[data-gid]').forEach(el => { const f = onFloor().find(x => x.group && x.group.bookingId === el.dataset.gid); if (f) el.querySelector('.cd').textContent = cdText(f, t); });
  }
}

function scanBand(v) {
  v = v.trim().toUpperCase(); const f = S.floor.find(x => x.ticketNo.toUpperCase() === v);
  if (!f) return toast('No ticket ' + v + ' found', 'bad');

function tvMode(on) {

const CF = { cat: 'Snacks', cart: [], child: null, discount: 0, discBy: null, q: '', hi: 0, keep: false };
function cfItems() { const q = CF.q.trim().toLowerCase(); return q ? ST().menu.filter(m => m.active && m.stock > 0 && m.cat !== 'Party Meals' && (m.name.toLowerCase().includes(q) || m.cat.toLowerCase().includes(q))) : ST().menu.filter(m => m.cat === CF.cat); }
function cfTiles() {

  return (q && !items.length ? `<div class="muted">No item matches "${esc(q)}"</div>` : '') + items.map((m, i) => `<button class="tile ${q && i === CF.hi ? 'kbsel' : ''}" ${!m.active || m.stock <= 0 ? 'disabled' : ''} onclick="cfAdd('${m.id}')"><span class="em">${m.emoji}</span><span class="nm">${esc(m.name)}</span><span class="pr">${m.price ? pkr(m.price) : 'Included'}</span>${m.stock < 5 ? `<span class="pill ${m.stock <= 0 ? 'p-bad' : 'p-warn'} low">${m.stock <= 0 ? 'Out' : m.stock + ' left'}</span>` : ''}</button>`).join('');

function cfAdd(id) { CF.keep = document.activeElement && document.activeElement.id === 'cf-search'; if (CF.keep) { CF.q = ''; CF.hi = 0; } const m = ST().menu.find(x => x.id === id); const inCart = sum(CF.cart.filter(l => l.id === id), l => l.qty); if (inCart >= m.stock) return toast('Only ' + m.stock + ' ' + m.name + ' left in stock', 'bad'); const ex = CF.cart.find(l => l.id === id); if (ex) ex.qty++; else CF.cart.push({ id, name: m.name, qty: 1, price: m.price, cat: 'cafe', sub: m.cat }); renderMain(); }
function cfQty(i, k) { const l = CF.cart[i]; const m = ST().menu.find(x => x.id === l.id); if (k > 0 && l.qty >= m.stock) return toast('Only ' + m.stock + ' left', 'bad'); l.qty += k; if (l.qty <= 0) CF.cart.splice(i, 1); if (!CF.cart.length) CF.discount = 0; renderMain(); }
function cfLink() {
  const draw = q => onFloor().filter(f => !q || f.name.toLowerCase().includes(q.toLowerCase()) || f.ticketNo.toLowerCase().includes(q.toLowerCase())).slice(0, 12).map(f => `<button class="btn block" style="justify-content:space-between" onclick="CF.child='${f.id}';closeModal();renderMain()"><span>${esc(f.name)}</span><span class="small muted">${esc(f.ticketNo)}</span></button>`).join('') || '<div class="muted">No match on the floor</div>';

  el.querySelector('#lk-q').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); const b = el.querySelector('#lk-r button'); if (b) b.click(); } };
}
async function cfDiscount() {

async function cfPay() {
  const gross = sum(CF.cart, l => l.qty * l.price), total = Math.max(0, gross - CF.discount);
  const r = await payModal(total, 'Café payment'); if (!r) return;

  if (CF.discount) audit('money', `Gave a ${pkr(CF.discount)} discount on café order ${sale.no} (${pkr(sale.total + CF.discount)} before discount)`, { level: 'warn', appr: CF.discBy });
  CF.cart.forEach(l => { const m = ST().menu.find(x => x.id === l.id); if (m) m.stock = Math.max(0, m.stock - l.qty); });

   ===================================================================== */
const BKV = { tab: 'cal', week: 0, past: false };
const STATUS_PILL = { Enquiry: 'p-grey', Confirmed: 'p-blue', 'Checked in': 'p-purple', Completed: 'p-ok', Cancelled: 'p-bad' };
function slotsFor(date) { const h = ST().hours[new Date(parseYmd(date)).getDay()]; const out = []; for (let m = h.o; m + 120 <= h.c; m += 120) out.push(m); return out; }
function liveBookings(branch = session.branch) { return S.bookings.filter(b => b.branch === branch && b.status !== 'Cancelled'); }
function clash(branch, date, room, start, exceptId) { return liveBookings(branch).find(b => b.id !== exceptId && b.date === date && b.room === room && Math.abs(b.start - start) < 120); }
function bkLabel(b) { return b.type === 'party' ? b.childName + "'s party" : b.school; }
function bkBalance(b) { return b.total - b.paid; }
function bkRecalc(b) { b.total = b.kids * b.price + sum(b.extras, l => l.qty * l.price); }
SCREENS.bookings = {
  render() {
    const tabs = `<div class="tabs"><button class="${BKV.tab === 'cal' ? 'on' : ''}" data-key="Alt+C" onclick="BKV.tab='cal';renderMain()">📅 Calendar</button><button class="${BKV.tab === 'list' ? 'on' : ''}" data-key="Alt+L" onclick="BKV.tab='list';renderMain()">📋 List</button></div>`;
    return head('Bookings', `${tabs}<button class="btn pink" data-key="Alt+P" onclick="newBooking('party')">🎉 New Party</button><button class="btn orange" data-key="Alt+S" onclick="newBooking('school')">🏫 New School Trip</button>`) + (BKV.tab === 'cal' ? bkCalendar() : bkList());
  }
};
function bkCalendar() {
  const start = addDays(today(), BKV.week * 7), days = [...Array(7)].map((_, i) => addDays(start, i));
  const cell = (date, room) => {
    const bs = liveBookings().filter(b => b.date === date && b.room === room);
    const items = slotsFor(date).filter(s => !bs.some(b => Math.abs(b.start - s) < 120)).map(s => ({ s })).concat(bs.map(b => ({ s: b.start, b }))).sort((a, b) => a.s - b.s);
    return `<div class="cell">${items.map(it => it.b ? `<button class="slot ${it.b.status === 'Enquiry' ? 'enq' : it.b.type}" onclick="openBooking('${it.b.id}')"><b>${minT(it.s)}</b>${esc(bkLabel(it.b))} · ${it.b.kids} kids${it.b.status === 'Enquiry' ? ' · enquiry' : ''}</button>`
      : `<button class="slot" onclick="newBooking('party',{date:'${date}',start:${it.s},room:'${room}'})"><b>${minT(it.s)}</b>Free</button>`).join('')}</div>`;
  };
  return `<div class="row" style="margin-bottom:12px"><button class="btn sm" data-key="Alt+," aria-label="Previous week" onclick="BKV.week--;renderMain()">◀ Previous</button><b>${fmtD(parseYmd(days[0]))} to ${fmtD(parseYmd(days[6]))}</b><button class="btn sm" data-key="Alt+." aria-label="Next week" onclick="BKV.week++;renderMain()">Next ▶</button>${BKV.week ? `<button class="btn sm ghost" onclick="BKV.week=0;renderMain()">This week</button>` : ''}
    <span class="right row small"><span class="pill p-pink">Party</span><span class="pill p-orange">School trip</span><span class="pill p-grey">Enquiry</span></span></div>
  <div class="tablewrap"><div class="cal"><div></div>${days.map(d => `<div class="hd ${d === today() ? 'today' : ''}">${new Date(parseYmd(d)).toLocaleDateString('en-GB', { weekday: 'short' })}<br><span class="small">${new Date(parseYmd(d)).getDate()} ${new Date(parseYmd(d)).toLocaleDateString('en-GB', { month: 'short' })}</span></div>`).join('')}
  ${ST().rooms.map(r => `<div class="rm">${esc(r)}</div>${days.map(d => cell(d, r)).join('')}`).join('')}</div></div>`;
}
function bkList() {
  const L = S.bookings.filter(b => b.branch === session.branch && (BKV.past || b.date >= today())).sort((a, b) => (a.date + pad(a.start, 4)).localeCompare(b.date + pad(b.start, 4)));
  return `<div class="card"><div class="row" style="margin-bottom:8px"><h2>${BKV.past ? 'All bookings' : 'Upcoming bookings'}</h2><label class="right row small"><input type="checkbox" style="width:22px;min-height:22px" ${BKV.past ? 'checked' : ''} onchange="BKV.past=this.checked;renderMain()"> Show past</label></div>
  <div class="tablewrap"><table><thead><tr><th>No.</th><th>Date & time</th><th>Booking</th><th>Room</th><th class="r">Kids</th><th>Status</th><th class="r">Total</th><th class="r">Advance paid</th><th class="r">Balance due</th><th></th></tr></thead><tbody>
  ${L.map(b => `<tr><td class="num">${esc(b.no)}</td><td>${fmtD(parseYmd(b.date))} · ${minT(b.start)}</td><td><span class="pill ${b.type === 'party' ? 'p-pink' : 'p-orange'}">${b.type === 'party' ? 'Party' : 'School'}</span> <b>${esc(bkLabel(b))}</b></td><td>${esc(b.room)}</td><td class="r">${b.kids}</td>
  <td><span class="pill ${STATUS_PILL[b.status]}">${b.status}</span></td><td class="r">${pkr(b.total)}</td><td class="r">${pkr(Math.min(b.paid, b.advance))}</td><td class="r">${b.status === 'Cancelled' ? 'None' : pkr(bkBalance(b))}</td><td><button class="btn sm" onclick="openBooking('${b.id}')">Open</button></td></tr>`).join('') || `<tr><td colspan="10">${emptyState('No bookings yet')}</td></tr>`}</tbody></table></div></div>`;
}

/* ---------- New party / school trip ---------- */
let BF = null;
function nextSaturday() { let d = today(); for (let i = 1; i <= 7; i++) { const x = addDays(today(), i); if (new Date(parseYmd(x)).getDay() === 6) return x; } return d; }
function newBooking(type, pre = {}) {
  if (!can('sell')) return toast('Your role cannot take bookings', 'bad');
  const date = pre.date || (type === 'party' ? nextSaturday() : addDays(today(), 7));
  BF = { type, pkg: 'prem', date, start: pre.start ?? null, room: pre.room || 'Room B', childName: '', childAge: '', parentName: '', phone: '', kids: type === 'party' ? 12 : 30, theme: '', notes: '', school: '', teacher: '', teachers: 3, price: type === 'party' ? 1950 : ST().schoolPrice, err: '' };
  if (BF.start == null) BF.start = (slotsFor(date).find(s => !clash(session.branch, date, BF.room, s)) ?? slotsFor(date)[0]);
  go('bknew');
}
function bfTotals() { const price = BF.type === 'party' ? ST().packages.find(p => p.id === BF.pkg).price : (Number(BF.price) || 0); const total = (Number(BF.kids) || 0) * price; const adv = Math.round(total * ST().advancePct / 100); return { price, total, adv, bal: total - adv }; }
function bfError() {
  const kids = Number(BF.kids) || 0;
  if (BF.type === 'party') { const p = ST().packages.find(x => x.id === BF.pkg); if (kids < p.min) return `${p.name} needs at least ${p.min} kids. You have ${kids}.`; if (!BF.childName.trim()) return 'Add the birthday child’s name.'; if (!BF.parentName.trim()) return 'Add the parent’s name.'; }
  else { if (!BF.school.trim()) return 'Add the school name.'; if (!BF.teacher.trim()) return 'Add the teacher in charge.'; if (kids < 1) return 'Add the number of children.'; if (!(Number(BF.price) > 0)) return 'Price per child must be above zero.'; }
  if (BF.start == null) return 'This day has no free 2-hour slots in opening hours.';
  const c = clash(session.branch, BF.date, BF.room, BF.start); if (c) return `${BF.room} is already booked at ${minT(c.start)} (${bkLabel(c)}). Pick another slot or room.`;
  return '';
}
SCREENS.bknew = {
  render() {
    if (!BF) newBooking('party');
    const st = ST(), T = bfTotals(), slots = slotsFor(BF.date), party = BF.type === 'party';
    const inp = (k, lbl, attrs = '') => `<label class="field"><span>${lbl}</span><input value="${esc(BF[k])}" ${attrs} oninput="BF.${k}=this.value;bfLive()"></label>`;
    return head(party ? 'New Party' : 'New School Trip', `<button class="btn ghost" data-key="Alt+B" onclick="go('bookings')">Back to bookings</button>`) + `<div class="split"><div class="col" style="gap:16px">
    ${party ? `<div class="grid g2">${st.packages.map(p => `<button class="pkg ${BF.pkg === p.id ? 'on' : ''}" data-key="Alt+${st.packages.indexOf(p) + 1}" onclick="BF.pkg='${p.id}';renderMain()"><div class="row"><h2>${esc(p.name)}</h2><span class="right money"><b>${pkr(p.price)}</b>/child</span></div><div class="small muted">Minimum ${p.min} kids</div><ul>${p.incl.map(i => `<li>${esc(i)}</li>`).join('')}</ul></button>`).join('')}</div>` : ''}
    <div class="card col"><h2>When & where</h2><div class="grid g3"><label class="field"><span>Date</span><input type="date" id="bf-date" value="${BF.date}" min="${today()}" onchange="BF.date=this.value;BF.start=(slotsFor(BF.date).find(s=>!clash(session.branch,BF.date,BF.room,s))??slotsFor(BF.date)[0]);renderMain()"></label>
      <label class="field"><span>Room</span><select onchange="BF.room=this.value;renderMain()">${st.rooms.map(r => `<option ${BF.room === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></label>
      <label class="field"><span>Slot (2 hours)</span><select onchange="BF.start=Number(this.value);renderMain()">${slots.map(s => { const c = clash(session.branch, BF.date, BF.room, s); return `<option value="${s}" ${BF.start === s ? 'selected' : ''} ${c ? 'disabled' : ''}>${minT(s)} to ${minT(s + 120)}${c ? ' · booked' : ''}</option>`; }).join('')}</select></label></div>
      <div class="hint">${fmtDY(BF.date)} · open ${minT(st.hours[new Date(parseYmd(BF.date)).getDay()].o)} to ${minT(st.hours[new Date(parseYmd(BF.date)).getDay()].c)}</div></div>
    <div class="card col"><h2>${party ? 'Birthday details' : 'School details'}</h2>
      ${party ? `<div class="grid g2">${inp('childName', 'Birthday child name *', 'data-autofocus')}${inp('childAge', 'Turning (age)', 'inputmode="numeric"')}${inp('parentName', 'Parent name *')}${inp('phone', 'Parent phone', 'inputmode="tel"')}</div><div class="hint">Phone is for lookup only: we never message customers.</div>`
        : `<div class="grid g2">${inp('school', 'School name *', 'data-autofocus')}${inp('teacher', 'Teacher in charge *')}${inp('phone', 'Teacher phone', 'inputmode="tel"')}${inp('teachers', 'Number of teachers (free)', 'inputmode="numeric"')}</div>`}
      <div class="grid g2">${inp('kids', 'Number of ' + (party ? 'kids' : 'children') + ' *', 'inputmode="numeric" id="bf-kids"')}${party ? inp('theme', 'Theme') : inp('price', 'Price per child (PKR)', 'inputmode="numeric"')}</div>
      <label class="field"><span>Notes</span><textarea oninput="BF.notes=this.value" style="min-height:70px">${esc(BF.notes)}</textarea></label></div>
    </div><div class="card pad summary col"><h2>Price</h2><div class="pricebox" id="bf-price">${bfPriceBox(T)}</div><div class="err-msg" id="bf-err">${esc(bfError())}</div>
    <button class="btn pink lg block" data-key="F9" onclick="bfSave(true)">Take advance ${ST().advancePct}%</button><button class="btn block" data-key="Alt+E" onclick="bfSave(false)">Save as enquiry (no advance)</button></div></div>`;
  }
};
function bfPriceBox(T) { return `<div class="line"><span>${Number(BF.kids) || 0} × ${pkr(T.price)}</span><span>${pkr(T.total)}</span></div>${BF.type === 'school' ? `<div class="line muted"><span>${Number(BF.teachers) || 0} teachers</span><span>Free</span></div>` : ''}<div class="line total"><span>Total</span><span>${pkr(T.total)}</span></div><div class="line" style="color:var(--brand-pink);font-weight:700"><span>Advance ${ST().advancePct}%</span><span>${pkr(T.adv)}</span></div><div class="line muted"><span>Balance on the day</span><span>${pkr(T.bal)}</span></div>`; }
function bfLive() { const p = $('#bf-price'); if (p) p.innerHTML = bfPriceBox(bfTotals()); const e = $('#bf-err'); if (e) e.textContent = bfError(); }
async function bfSave(withAdvance) {
  const err = bfError(); if (err) { toast(err, 'bad'); return; }
  if (withAdvance && !openShift()) return toast('Open the counter to take the advance', 'bad');
  const T = bfTotals(), br = session.branch;
  const b = { id: uid(), no: (BF.type === 'party' ? 'PTY-' : 'SCH-') + br + '-' + pad(nextSeq((BF.type === 'party' ? 'PTY' : 'SCH') + br), 4), type: BF.type, branch: br, date: BF.date, start: BF.start, room: BF.room,
    kids: Number(BF.kids), price: T.price, notes: BF.notes, phone: BF.phone, extras: [], guests: [], createdAt: now(), createdBy: session.user.id, paid: 0, total: T.total, advance: T.adv, status: 'Enquiry' };
  if (BF.type === 'party') Object.assign(b, { pkg: BF.pkg, childName: BF.childName.trim(), childAge: BF.childAge, parentName: BF.parentName.trim(), theme: BF.theme });
  else Object.assign(b, { school: BF.school.trim(), teacher: BF.teacher.trim(), teachers: Number(BF.teachers) || 0 });
  if (withAdvance) {
    const r = await payModal(T.adv, 'Advance for ' + bkLabel(b)); if (!r) { S.seq[(BF.type === 'party' ? 'PTY' : 'SCH') + br]--; return; }
    S.bookings.push(b);
    const sale = recordSale('advance', [{ name: 'Advance ' + b.no + ' (' + ST().advancePct + '%)', qty: 1, price: T.adv, cat: b.type }], r, { bookingId: b.id, bookingNo: b.no });
    b.paid = T.adv; b.status = 'Confirmed'; audit('booking', `Booked ${bkLabel(b)} (${b.no}) on ${fmtDY(b.date)}, ${b.kids} kids, advance ${pkr(T.adv)} taken`); save(); BF = null; go('bookings');
    bookingReceiptModal(b, sale);
  } else { S.bookings.push(b); audit('booking', `Saved an enquiry for ${bkLabel(b)} (${b.no}) on ${fmtDY(b.date)}`); save(); BF = null; toast('Enquiry ' + b.no + ' saved', 'ok'); go('bookings'); }
}
function bookingReceiptModal(b, sale) {
  window.__bk = [b.id, sale ? sale.id : null];
  openModal(mh('✅ ' + esc(b.no) + ' ' + (sale ? (sale.kind === 'advance' ? 'confirmed' : 'paid') : ''), esc(bkLabel(b)) + ' · ' + fmtDY(b.date)) + `<div class="prevwrap">${bookingReceiptHTML(b, sale)}</div><div class="mf"><button class="btn" data-key="Alt+P" onclick="const x=window.__bk;doPrint(bookingReceiptHTML(S.bookings.find(b=>b.id===x[0]),S.sales.find(s=>s.id===x[1])),'receipt','Booking receipt printed')">🧾 Print booking receipt</button><button class="btn primary" data-key="F9" autofocus onclick="closeModal()">Done</button></div>`);
}

/* ---------- Booking detail / check-in ---------- */
function openBooking(id) { go('bkdetail', id); }
SCREENS.bkdetail = {
  render() {
    const b = S.bookings.find(x => x.id === routeArg); if (!b) return head('Booking') + emptyState('Booking not found');
    const pk = b.type === 'party' ? ST().packages.find(p => p.id === b.pkg) : null, sales = S.sales.filter(x => x.bookingId === b.id);
    const onF = S.floor.filter(f => f.group && f.group.bookingId === b.id);
    const active = !['Completed', 'Cancelled'].includes(b.status);
    return head(`${esc(b.no)} <span class="pill ${STATUS_PILL[b.status]}">${b.status}</span>`, `<button class="btn ghost" data-key="Alt+B" onclick="go('bookings')">Back</button>${active && can('sell') ? `<button class="btn ghost" data-key="Alt+X" onclick="bkCancel('${b.id}')">Cancel booking</button>` : ''}`)
      + `<div class="split"><div class="col" style="gap:16px"><div class="card col"><div class="row"><span class="pill ${b.type === 'party' ? 'p-pink' : 'p-orange'}">${b.type === 'party' ? esc(pk.name) : 'School trip'}</span><h2>${esc(bkLabel(b))}</h2></div>
        <div class="grid g3 small"><div><div class="lbl">When</div>${fmtDY(b.date)}<br>${minT(b.start)} to ${minT(b.start + 120)}</div><div><div class="lbl">Room</div>${esc(b.room)}</div><div><div class="lbl">${b.type === 'party' ? 'Parent' : 'Teacher'}</div>${esc(b.type === 'party' ? b.parentName : b.teacher)}<br>${esc(b.phone || '')}</div>
        ${b.type === 'party' ? `<div><div class="lbl">Birthday</div>${esc(b.childName)} turns ${esc(b.childAge)}</div><div><div class="lbl">Theme</div>${esc(b.theme || 'None')}</div>` : `<div><div class="lbl">Teachers</div>${b.teachers} (free)</div>`}<div><div class="lbl">Notes</div>${esc(b.notes || 'None')}</div></div></div>
      <div class="card col"><div class="row"><h2>Guest list</h2><span class="muted small">${b.kids} kids booked</span></div>
        ${b.status === 'Checked in' || b.status === 'Completed' ? `<div class="groupkids">${onF.map(f => `<div class="gk"><b>${esc(f.name)}</b><span class="pill ${f.status === 'on' ? 'p-ok' : 'p-grey'}">${f.status === 'on' ? 'On floor' : 'Out'}</span></div>`).join('')}</div>`
        : `<textarea id="bk-guests" placeholder="Paste names, one per line">${esc((b.guests || []).join('\n'))}</textarea><div class="row"><button class="btn sm" data-key="Alt+G" onclick="bkAutoNumber('${b.id}')">Auto-number Guest 1…${b.kids}</button><span class="hint" id="bk-gc"></span></div>
        ${b.status === 'Confirmed' && can('sell') ? `<button class="btn pink lg" data-key="Alt+K" onclick="bkCheckIn('${b.id}')">Check in & print all wristbands</button>` : b.status === 'Enquiry' ? '<div class="hint">Take the advance to confirm before check-in.</div>' : ''}`}</div>
      ${active && can('sell') ? `<div class="card col"><h2>Add to the bill</h2><div class="row"><input id="bk-xk" placeholder="Extra child name" style="max-width:260px"><button class="btn" data-key="Alt+N" onclick="bkExtraKid('${b.id}')">+ Extra kid (${pkr(b.price)})</button></div>
        <div class="row"><select id="bk-xi" style="max-width:260px">${ST().menu.filter(m => m.active).map(m => `<option value="${m.id}">${m.emoji} ${esc(m.name)}: ${m.price ? pkr(m.price) : 'Included'}</option>`).join('')}</select><button class="btn" data-key="Alt+I" onclick="bkExtraItem('${b.id}')">+ Café item</button></div></div>` : ''}
    </div><div class="card pad summary col"><h2>Bill</h2><div class="line"><span>${b.kids} × ${pkr(b.price)}</span><span>${pkr(b.kids * b.price)}</span></div>
      ${b.extras.map(l => `<div class="line"><span>${l.qty} × ${esc(l.name)}</span><span>${pkr(l.qty * l.price)}</span></div>`).join('')}<div class="line total"><span>Total</span><span>${pkr(b.total)}</span></div>
      ${sales.map(x => `<div class="line small"><span>${x.kind === 'advance' ? 'Advance' : 'Payment'} · ${fmtD(x.at)} · ${esc(x.no)}</span><span>−${pkr(x.total)}</span></div>`).join('')}
      <div class="line total" style="color:${bkBalance(b) > 0 ? 'var(--bad)' : 'var(--ok)'}"><span>Balance due</span><span>${pkr(bkBalance(b))}</span></div>
      ${b.status === 'Enquiry' && can('sell') ? `<button class="btn pink lg block" data-key="F9" onclick="bkTakeAdvance('${b.id}')">Take advance ${pkr(b.advance)}</button>` : ''}
      ${['Confirmed', 'Checked in'].includes(b.status) && bkBalance(b) > 0 && can('sell') ? `<button class="btn primary lg block" data-key="F9" onclick="bkCollect('${b.id}')">Collect balance ${pkr(bkBalance(b))}</button>` : ''}
      ${b.status === 'Checked in' && bkBalance(b) <= 0 ? `<button class="btn green lg block" data-key="F9" onclick="bkComplete('${b.id}')">Mark completed</button>` : ''}
      <button class="btn block" data-key="Alt+R" onclick="bookingReceiptModal(S.bookings.find(x=>x.id==='${b.id}'),S.sales.filter(x=>x.bookingId==='${b.id}').slice(-1)[0])">🧾 Booking receipt</button></div></div>`;
  },
  after() { const t = $('#bk-guests'); if (t) { const b = S.bookings.find(x => x.id === routeArg); const upd = () => { const n = t.value.split('\n').map(s => s.trim()).filter(Boolean).length; b.guests = t.value.split('\n').map(s => s.trim()).filter(Boolean); $('#bk-gc').textContent = `${n} of ${b.kids} names${n < b.kids ? ': the rest print as Guest N' : ''}`; save(); }; t.oninput = upd; upd(); } }
};
function bkAutoNumber(id) { const b = S.bookings.find(x => x.id === id); const t = $('#bk-guests'); const have = t.value.split('\n').map(s => s.trim()).filter(Boolean); for (let i = have.length; i < b.kids; i++) have.push('Guest ' + (i + 1)); t.value = have.join('\n'); t.oninput(); }
function bkBands(b, names) {
  const t = now(), label = b.type === 'party' ? bkLabel(b) : b.school;
  return names.map((n, i) => ({ id: uid(), ticketNo: b.no + '-' + pad((b._seqKid = (b._seqKid || 0) + 1), 2), name: n, age: '', pass: b.type, start: t, end: t + 120 * MIN, branch: b.branch, counter: session.counter, saleId: null, group: { type: b.type, bookingId: b.id, label }, status: 'on', fl: {}, by: session.user.id }));
}
function bkCheckIn(id) {
  const b = S.bookings.find(x => x.id === id); if (!openShift()) return toast('Open the counter first', 'bad');
  const names = (b.guests || []).slice(0, b.kids); for (let i = names.length; i < b.kids; i++) names.push('Guest ' + (i + 1));
  const bands = bkBands(b, names); S.floor.push(...bands); b.status = 'Checked in'; b.checkedInAt = now(); audit('booking', `Checked in ${bkLabel(b)} (${b.no}): ${bands.length} children on the floor`); save(); renderMain(); renderAlerts(true);
  window.__bands = bands;
  openModal(mh('🎉 ' + esc(bkLabel(b)) + ' checked in', bands.length + ' children added to the Floor Board as one group · ends ' + fmtT(bands[0].end)) + `<div class="prevwrap" style="align-items:stretch;max-height:50vh">${bands.map(bandHTML).join('')}</div>
   <div class="mf"><button class="btn" data-key="Alt+F" onclick="closeModal();go('floor')">Open Floor Board</button><button class="btn pink" data-key="F9" onclick="doPrint(window.__bands.map(bandHTML).join(''),'band','${bands.length} party wristbands printed')">🎗️ Print all ${bands.length} wristbands</button></div>`, 'wide');
}
function bkExtraKid(id) {
  const b = S.bookings.find(x => x.id === id); const n = $('#bk-xk').value.trim() || 'Guest ' + (b.kids + 1);
  b.kids++; b.guests = (b.guests || []).concat(n); bkRecalc(b);
  if (b.status === 'Checked in') { const band = bkBands(b, [n])[0]; const ref = S.floor.find(f => f.group && f.group.bookingId === b.id); if (ref) { band.start = ref.start; band.end = ref.end; } S.floor.push(band); doPrint(bandHTML(band), 'band', 'Band printed for ' + n); }

function reportRange(p) {

}
function reportData() {

function barChart(data, opts = {}) {
  const W = 620, H = 230, pl = 52, pb = 34, pt = 18, max = Math.max(1, ...data.map(d => d.v)), bw = (W - pl - 10) / Math.max(1, data.length);

  const y = v => pt + (H - pt - pb) * (1 - v / nice);
  let g = ''; for (let i = 0; i <= 4; i++) { const v = nice * i / 4; g += `<line x1="${pl}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${opts.money ? (v >= 1000 ? Math.round(v / 1000) + 'k' : v) : Math.round(v)}</text>`; }

function hBars(data, money = true) {

const RT = {}; // report tables for CSV: id -> {head, rows}

}

/* Seed: derive a believable history from the seeded shifts, cash moves, deposits and bookings */
function seedAudit(s) {
  const A = [], st = s.settings, cn = id => (st.counters.find(c => c.id === id) || {}).name || id;
  const add = (at, by, branch, counter, cat, text, level = 'info', appr = null) => A.push({ id: uid(), at, by, branch, counter, cat, level, text, appr });
  s.shifts.forEach(sh => {
    add(sh.openedAt, sh.openedBy, sh.branch, sh.counter, 'drawer', `Opened ${cn(sh.counter)} with a float of ${pkr(sh.float)}`, 'info', sh.approvedBy);
    if (sh.status === 'closed') { const v = sh.variance; add(sh.closedAt, sh.closedBy, sh.branch, sh.counter, 'drawer', `Closed ${cn(sh.counter)}: counted ${pkr(sh.counted)} against ${pkr(sh.expected)} expected (${varText(v)})${sh.varianceReason ? '. Reason: ' + sh.varianceReason : ''}`, Math.abs(v) > st.varianceLimit ? 'bad' : v ? 'warn' : 'info', sh.varianceBy || null); }
  });
  s.moves.forEach(m => { const sh = s.shifts.find(x => x.id === m.shiftId); if (sh) add(m.at, m.by, sh.branch, sh.counter, 'drawer', `Cash ${m.type} ${pkr(m.amount)} (${m.reason}${m.note ? ': ' + m.note : ''})`, m.type === 'out' && m.amount > st.cashOutLimit ? 'warn' : 'info', m.approvedBy || null); });
  s.deposits.forEach(d => add(d.at, d.by, d.branch, null, 'deposit', `Added deposit slip ${d.slip}: ${pkr(d.amount)} to ${d.bank}`));
  s.bookings.forEach(b => add(b.createdAt, b.createdBy, b.branch, 'C1', 'booking', `${b.status === 'Enquiry' ? 'Saved an enquiry for' : 'Booked'} ${b.type === 'party' ? b.childName + "'s party" : b.school} (${b.no}) on ${fmtDY(b.date)}`));
  const n = s.seededAt || Date.now(), y = n - DAY;
  add(y - 3 * HOUR, 'u1', 'KHI', 'C1', 'money', 'Waived PKR 500 overtime for Hamza Mirza (12 min over)', 'bad', 'u3');
  add(y - 2 * HOUR, 'u5', 'LHR', 'C1', 'money', 'Refunded sale LHR-C1-S00211: PKR 1,300 (charged twice)', 'bad', 'u6');
  add(n - 150 * MIN, null, 'KHI', 'C2', 'security', 'Wrong PIN entered on the sign-in screen', 'warn');
  add(n - 95 * MIN, 'u1', 'KHI', 'C1', 'security', 'Wrong manager PIN entered for: Apply a café discount', 'warn');
  return A.sort((a, b) => a.at - b.at);
}
function seedSessions(s) {
  const n = s.seededAt || Date.now(), sh = s.shifts.find(x => x.branch === 'KHI' && x.counter === 'C1' && x.status === 'open'), o = sh ? sh.openedAt : n - 3 * HOUR;
  const row = (user, branch, counter, start, end, lastAt) => ({ id: uid(), user, branch, counter, start, end, lastAt, device: 'other' });
  return [row('u1', 'KHI', 'C1', o - 10 * MIN, n - 5 * MIN, n - 5 * MIN), row('u3', 'KHI', 'C3', o - 12 * MIN, null, n - 8 * MIN), row('u2', 'KHI', 'C2', n - 150 * MIN, null, n - 3 * MIN),
    row('u5', 'LHR', 'C1', o - 10 * MIN, null, n - 12 * MIN), row('u6', 'LHR', 'C1', o - 20 * MIN, o + 40 * MIN, o + 40 * MIN)];
}
