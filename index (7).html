/* =====================================================================
   KEYBOARD — every cashier function has a shortcut.
   Buttons declare their own key with data-key="F9" / "Alt+A" / "Alt+Shift+M".
   The handler finds the visible button for the pressed key (inside the open
   window first) and presses it. Key hints appear once the keyboard is used.
   ===================================================================== */
function keyName(e) {
  let k = e.code || '';
  if (/^Key[A-Z]$/.test(k)) k = k.slice(3);
  else if (/^Digit\d$/.test(k)) k = k.slice(5);
  else if (/^Numpad\d$/.test(k)) k = k.slice(6);
  else if (k === 'NumpadEnter') k = 'Enter';
  else k = e.key && e.key.length === 1 ? e.key.toUpperCase() : e.key;
  const mod = e.ctrlKey || e.altKey || /^F\d+$/.test(k);
  return (e.ctrlKey ? 'Ctrl+' : '') + (e.altKey ? 'Alt+' : '') + (e.shiftKey && mod ? 'Shift+' : '') + k;
}
const isTyping = el => el && (el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || (el.tagName === 'INPUT' && !['checkbox', 'radio', 'button'].includes(el.type)));
const visible = el => el && el.offsetParent !== null && !el.closest('[hidden]');
function findKey(scope, name) { return [...scope.querySelectorAll('[data-key]')].find(el => el.dataset.key === name && !el.disabled && visible(el)); }
function pressKeyTarget(el) {
  if (isTyping(el)) { el.focus(); el.select && el.select(); return; }
  el.classList.add('kbpress'); setTimeout(() => el.classList.remove('kbpress'), 160); el.click();
}
function trapTab(e, modal) {
  const f = [...modal.querySelectorAll('button:not([disabled]), input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])')].filter(visible);
  if (!f.length) return; const i = f.indexOf(document.activeElement);
  if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && (i === -1 || i === f.length - 1)) { e.preventDefault(); f[0].focus(); }
}
const DEMO_KEYS = { 'Alt+Shift+1': () => setSpeed(1), 'Alt+Shift+2': () => setSpeed(10), 'Alt+Shift+3': () => setSpeed(60), 'Alt+Shift+0': () => jump(10), 'Alt+Shift+P': () => togglePause() };

document.addEventListener('keydown', e => {
  if (['Shift', 'Alt', 'Control', 'Meta', 'AltGraph'].includes(e.key)) { if (e.key === 'Alt') e.preventDefault(); return; }
  document.body.classList.add('kb');
  const name = keyName(e), t = e.target, typing = isTyping(t);
  // Sign-in screen: type the PIN
  const login = $('#login');
  if (!login.hidden) {
    if (/^\d$/.test(e.key)) { e.preventDefault(); const b = login.querySelector(`#lpp [data-k="${e.key}"]`); b && b.click(); }
    else if (e.key === 'Backspace' && !typing) { e.preventDefault(); login.querySelector('#lpp [data-k="⌫"]').click(); }
    else if (e.key === 'Escape') { loginPin = ''; loginDots(); }
    return;
  }
  if (!session.user) return;
  const modal = topModal();
  if (modal && e.key === 'Tab') { trapTab(e, modal); return; }
  // Manager PIN pad: type the PIN
  if (modal && modal.querySelector('#mpp') && (/^\d$/.test(e.key) || e.key === 'Backspace')) { e.preventDefault(); const k = e.key === 'Backspace' ? '⌫' : e.key; const b = modal.querySelector(`#mpp [data-k="${k}"]`); b && b.click(); return; }
  if (e.key === '/' && t.hasAttribute && t.hasAttribute('data-search') && !t.value) { e.preventDefault(); return; } // already in the search box
  // Demo clock keys work everywhere, even with the demo pill collapsed
  if (DEMO_KEYS[name]) { e.preventDefault(); DEMO_KEYS[name](); return; }
  // Buttons that declare this key (window first, else the whole app)
  const plain = !/^(Ctrl|Alt|F\d)/.test(name);
  if (!(typing && plain)) {
    const target = findKey(modal || document, name);
    if (target) { e.preventDefault(); e.stopPropagation(); pressKeyTarget(target); return; }
  }
  if (/^F\d+$/.test(name) && !['F5', 'F11', 'F12'].includes(name)) e.preventDefault(); // keep unused F-keys from opening browser help/find
  // Help
  if ((e.key === '?' && !typing) || name === 'Alt+/') { e.preventDefault(); showHelp(); return; }
  // Enter in a window's field submits the window's main button
  if (modal) {
    if (e.key === 'Enter' && typing && t.tagName === 'INPUT' && !t.onkeydown) { const go = findKey(modal, 'F9'); if (go) { e.preventDefault(); go.click(); } }
    return;
  }
  // Clickable cards (role=button)
  if ((e.key === 'Enter' || e.key === ' ') && t.getAttribute && t.getAttribute('role') === 'button') { e.preventDefault(); t.click(); return; }
  // "/" jumps to the search box on this screen
  if (e.key === '/' && !typing) { const s = [...document.querySelectorAll('#main [data-search]')].find(visible); if (s) { e.preventDefault(); s.focus(); s.select(); return; } }
  // Denomination grids: Enter moves to the next note, then to the main button
  if (e.key === 'Enter' && t.closest && t.closest('.denoms')) { e.preventDefault(); const ins = [...document.querySelectorAll('.denoms input')]; const i = ins.indexOf(t); if (i < ins.length - 1) { ins[i + 1].focus(); ins[i + 1].select(); } else { const g = findKey(document, 'F9'); g && g.focus(); } return; }
  const scr = SCREENS[route]; if (scr && scr.keys && scr.keys(e, name, typing)) { e.preventDefault(); return; }
}, true);
document.addEventListener('pointerdown', () => document.body.classList.remove('kb'), true);

/* ---------- New Ticket: Enter in a child row moves on / adds the next child ---------- */
SCREENS.ticket.keys = (e, name, typing) => {
  const t = e.target;
  if (name === 'Enter' && typing && /^kid-n-\d+$/.test(t.id)) {
    const i = Number(t.id.slice(6));
    if (i === TK.kids.length - 1) { if (t.value.trim()) tkAdd(); else toast('Type the child’s name first', 'bad'); }
    else { const n = $('#kid-n-' + (i + 1)); n.focus(); n.select(); }
    return true;
  }
  return false;
};

/* ---------- Café: type to search, arrows to choose, Enter adds; + / − change the last item ---------- */
SCREENS.cafe.after = () => {
  const s = $('#cf-search'); if (!s) return;
  s.oninput = () => { CF.q = s.value; CF.hi = 0; $('#cf-tiles').innerHTML = cfTiles(); };
  s.onkeydown = e => {
    const items = cfItems().filter(m => m.active && m.stock > 0);
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); CF.hi = Math.min(CF.hi + 1, items.length - 1); $('#cf-tiles').innerHTML = cfTiles(); }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); CF.hi = Math.max(CF.hi - 1, 0); $('#cf-tiles').innerHTML = cfTiles(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (CF.q.trim() && items[CF.hi]) cfAdd(items[CF.hi].id); else if (!CF.q.trim()) toast('Type part of an item name, e.g. "fries"', 'bad'); }
    else if (e.key === 'Escape' && CF.q) { e.preventDefault(); e.stopPropagation(); CF.q = ''; s.value = ''; $('#cf-tiles').innerHTML = cfTiles(); }
    else if ((e.key === '+' || e.key === '-') && !s.value) { e.preventDefault(); cfLast(e.key === '+' ? 1 : -1); }
  };
  if (CF.keep) { CF.keep = false; s.focus(); }
};
function cfLast(k) { if (!CF.cart.length) return toast('The order is empty', 'bad'); const i = CF.cart.length - 1; cfQty(i, k); const s = $('#cf-search'); if (s) s.focus(); }
SCREENS.cafe.keys = (e, name, typing) => {
  if (!typing && (e.key === '+' || e.key === '-')) { cfLast(e.key === '+' ? 1 : -1); return true; }
  if (!typing && /^[a-z]$/i.test(e.key) && !e.altKey && !e.ctrlKey) { const s = $('#cf-search'); if (s) { s.focus(); } return false; } // start typing to search
  return false;
};

/* ---------- Floor Board: arrows pick a card, M / E / R act on it ---------- */
function floorCards() { return [...document.querySelectorAll('#floorgrid [data-gid], #floorgrid [data-fid]')]; }
function floorSelEl() { return FB.sel ? (FB.sel.startsWith('g:') ? document.querySelector(`#floorgrid [data-gid="${FB.sel.slice(2)}"]`) : document.querySelector(`#floorgrid [data-fid="${FB.sel}"]`)) : null; }
function floorSelect(el) {
  document.querySelectorAll('#floorgrid .kbsel').forEach(x => x.classList.remove('kbsel'));
  if (!el) { FB.sel = null; return; }
  FB.sel = el.dataset.gid ? 'g:' + el.dataset.gid : el.dataset.fid; el.classList.add('kbsel'); el.scrollIntoView({ block: 'nearest' });
}
function floorSelKid() { const el = floorSelEl(); if (!el) return null; return el.dataset.fid || (onFloor().find(f => f.group && f.group.bookingId === el.dataset.gid) || {}).id; }
SCREENS.floor.keys = (e, name, typing) => {
  if (typing) {
    if (e.target.id === 'fl-search' && (e.key === 'ArrowDown' || e.key === 'Enter')) { const c = floorCards()[0]; if (c) { floorSelect(c); e.target.blur(); } return true; }
    return false;
  }
  const cards = floorCards(); if (!cards.length) return false;
  const cur = floorSelEl(); let i = cur ? cards.indexOf(cur) : -1;
  if (['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp', 'Home', 'End'].includes(e.key)) {
    const solo = cards.filter(c => c.dataset.fid), top0 = solo.length ? solo[0].offsetTop : 0, cols = Math.max(1, solo.filter(c => c.offsetTop === top0).length);
    if (i < 0) i = 0;
    else if (e.key === 'ArrowRight') i = Math.min(i + 1, cards.length - 1);
    else if (e.key === 'ArrowLeft') i = Math.max(i - 1, 0);
    else if (e.key === 'ArrowDown') i = cards[i].dataset.gid ? i + 1 : i + cols;
    else if (e.key === 'ArrowUp') i = cards[i].dataset.gid ? i - 1 : i - cols;
    else if (e.key === 'Home') i = 0; else i = cards.length - 1;
    floorSelect(cards[clamp(i, 0, cards.length - 1)]); return true;
  }
  const id = floorSelKid(); if (!id) { if (/^[MER]$/i.test(e.key) || e.key === 'Enter') { toast('Pick a child first with the arrow keys', 'bad'); return true; } return false; }
  if (/^m$/i.test(e.key)) { markOut(id); return true; }
  if (/^e$/i.test(e.key)) { extend(id); return true; }
  if (/^r$/i.test(e.key)) { const el = floorSelEl(); if (el.dataset.gid) reprintGroup(el.dataset.gid); else reprint(id); return true; }
  if (e.key === 'Enter' && cur && cur.dataset.gid) { FB.open[cur.dataset.gid] = !FB.open[cur.dataset.gid]; drawFloor(true); return true; }
  if (e.key === 'Escape') { floorSelect(null); return true; }
  return false;
};

/* ---------- Bookings: PageUp / PageDown change week; Esc goes back from a form ---------- */
SCREENS.bookings.keys = (e, name, typing) => {
  if (typing) return false;
  if (e.key === 'PageUp') { BKV.week--; renderMain(); return true; }
  if (e.key === 'PageDown') { BKV.week++; renderMain(); return true; }
  return false;
};
SCREENS.bknew.keys = SCREENS.bkdetail.keys = (e, name, typing) => { if (e.key === 'Escape' && !typing) { go('bookings'); return true; } return false; };

/* ---------- Shortcut help (? or Alt+/) ---------- */
function keyLabel(el) {
  const own = el.getAttribute('aria-label') || el.getAttribute('title') || el.getAttribute('placeholder');
  let txt = own || el.textContent; txt = txt.replace(/\s+/g, ' ').replace(/[⏰🔴🎟️🍟🎉👀📺🧾🎗️🍳🔗📅📋🏫💵💳📱🔒⌨🔔🔇⬇]/gu, '').trim();
  return txt.length > 48 ? txt.slice(0, 46) + '…' : txt;
}
function kbdHtml(k) { return k.split('+').map(p => `<kbd>${esc(p)}</kbd>`).join('<span class="muted">+</span>'); }
function showHelp() {
  if ($('#kbhelp')) { closeModal(); return; }
  const collect = scope => { const seen = new Set(), out = []; if (!scope) return out; scope.querySelectorAll('[data-key]').forEach(el => { if (!visible(el) || el.disabled) return; const k = el.dataset.key; if (seen.has(k)) return; seen.add(k); out.push([k, keyLabel(el)]); }); return out; };
  const order = k => (/^F/.test(k) ? '0' : /^Alt\+Shift/.test(k) ? '2' : '1') + k.padStart(12, ' ');
  const table = (title, rows) => rows.length ? `<div><h3 style="margin-bottom:6px">${title}</h3><table><tbody>${rows.sort((a, b) => order(a[0]).localeCompare(order(b[0]))).map(r => `<tr><td style="width:150px;white-space:nowrap">${kbdHtml(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table></div>` : '';
  const screenRows = collect($('#main')), alertRows = collect($('#alerts')), navRows = collect($('#nav')), topRows = collect($('#top'));
  const extra = {
    ticket: [['Enter', 'In a child name: next child, or add a new row']],
    cafe: [['/', 'Find an item (or just start typing)'], ['↑ ↓', 'Choose a search result'], ['Enter', 'Add the chosen item'], ['+  −', 'One more / one less of the last item'], ['Esc', 'Clear the search']],
    floor: [['/', 'Search children'], ['← → ↑ ↓', 'Pick a child card'], ['M', 'Mark out the picked child'], ['E', 'Extend the picked child 30 min'], ['R', 'Reprint the picked band'], ['Enter', 'Open or close a party group'], ['Esc', 'Clear the pick']],
    bookings: [['PageUp  PageDown', 'Previous / next week']], bknew: [['Esc', 'Back to bookings']], bkdetail: [['Esc', 'Back to bookings']],
    open: [['Enter', 'Next note in the count']], close: [['Enter', 'Next note in the count']]
  }[route] || [];
  const general = [['Tab  Shift+Tab', 'Move between buttons and fields'], ['Enter', 'Press the focused button, or confirm a window'], ['Esc', 'Close a window or exit TV mode'], ['0–9  Backspace', 'Type on any PIN pad'], ['?  Alt+/', 'Show or hide this list']];
  const demo = [['Alt+Shift+1', 'Demo speed 1×'], ['Alt+Shift+2', 'Demo speed 10×'], ['Alt+Shift+3', 'Demo speed 60×'], ['Alt+Shift+0', 'Demo clock +10 min'], ['Alt+Shift+P', 'Pause / resume the demo clock']];
  const plainTable = (title, rows) => rows.length ? `<div><h3 style="margin-bottom:6px">${title}</h3><table><tbody>${rows.map(r => `<tr><td style="width:150px;white-space:nowrap">${r[0].split('  ').map(kbdHtml).join(' ')}</td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table></div>` : '';
  const scrName = (NAV.find(n => n[0] === route) || [, { open: 'Open Day', bknew: 'Booking form', bkdetail: 'Booking' }[route] || 'This screen'])[1];
  openModal(`<div id="kbhelp"></div>` + mh('Keyboard shortcuts', 'F9 is always the main action on the screen: Pay, Take advance, Close day. Key labels show on buttons while you use the keyboard.') + `<div class="grid g2" style="align-items:start">
    <div class="col">${table('Go to', navRows)}${table('Top bar', topRows)}${table('Top alert banner', alertRows)}${plainTable('Everywhere', general)}</div>
    <div class="col">${table(esc(scrName) + ' buttons', screenRows)}${plainTable(esc(scrName) + ' keys', extra)}${plainTable('Demo controls', demo)}</div></div>
    <div class="mf"><button class="btn primary" onclick="closeModal()">Close</button></div>`, 'xwide');
}

boot();
</script></body></html>
